role_based_registration.product_form:
  path: '/product/create'
  defaults:
    _form: '\Drupal\role_based_registration\Form\ProductForm'
    _title: 'Create Product'
  requirements:
    _role: 'merchant'
    _permission: 'create product content'
    _custom_access: '\Drupal\role_based_registration\Form\ProductForm::access'
  options:
    _admin_route: FALSE